# KAVACH AI — Sovereign On-Premise Agentic AI Workbench
# One-command local stack. Nothing here reaches the public internet at runtime.
#
#   docker compose up --build
#   → frontend  http://localhost:3000
#   → backend   http://localhost:8000/api/health
#
# The backend runs with KAVACH_MODE=airgapped, so the application itself refuses
# external model providers and non-loopback inference URLs. Compose does NOT
# isolate the container network (its port must be reachable from the host
# browser); enforce network-level egress blocking with your host firewall.

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: kavach-backend
    environment:
      KAVACH_MODE: airgapped
      # Ollama is not part of this Compose stack; local model inference is used
      # when running the backend directly on the host.
      KAVACH_INFERENCE_PROVIDER: mock
    ports:
      - "8000:8000"
    volumes:
      - ./demo-data:/app/demo-data
      - ./generated:/app/generated
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: kavach-frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
